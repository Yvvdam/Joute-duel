<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Joute Duel</title>
<link rel="stylesheet" href="style.css"></head><body>
<div id="audio-ctrl" role="group" aria-label="Contrôle de la musique">
  <button type="button" id="vol-mute" title="Couper / Activer le son" aria-label="Couper le son">🔊</button>
  <button type="button" id="vol-down" title="Baisser le volume" aria-label="Baisser le volume">−</button>
  <input type="range" id="vol-slider" min="0" max="100" value="40" aria-label="Volume de la musique">
  <button type="button" id="vol-up" title="Monter le volume" aria-label="Monter le volume">+</button>
  <span id="vol-pct" aria-hidden="true">40%</span>
</div>
<audio id="menu-bgm" loop preload="auto" src="assets/Where_the_Mountains_Sleep.mp3"></audio>
<audio id="defeat-bgm" preload="auto" src="assets/defeat-beneath-25s-to-45s.mp3"></audio>
<audio id="victory-bgm" preload="auto" src="assets/victory-banners-20s.mp3"></audio>
<audio id="combat-bgm" loop preload="auto" src="assets/Gloria_In_Armis.mp3"></audio>
<div id="app"></div>
<script src="vendor/supabase.js"></script>
<script src="arena-engine.js"></script>
<script src="game.js"></script>
</body></html>
